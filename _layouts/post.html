---
layout: default
---

<div class="blog-page">
    <div id="wrapper">
        <header id="header">
            <h1><a href="{{ site.baseurl }}/index.html"><strong>{{ site.header.title }}</strong> {{ site.header.subtitle }}</a></h1>
            <nav>
                <ul>
                    <li><a href="{{ site.baseurl }}/blog.html">Blog&nbsp;&nbsp;<i class="fa fa-arrow-left"></i></a></li>
                </ul>
            </nav>
        </header>

        <div id="main" class="blog-content">
            <article class="blog-post">
                <h1>{{ page.title }}</h1>
                <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
                {{ content }}
            </article>
        </div>
    </div>
</div>
